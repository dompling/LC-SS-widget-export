name: Validate adaptive active-only preview
on:
  push:
    branches:
      - feat/adaptive-active-preview-only-20261120
    paths:
      - LCFloatingMenu/**
      - LCOrbit/**
      - .github/workflows/adaptive-active-preview-test.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check adaptive preview contracts
        run: python3 LCOrbit/Tests/check-adaptive-dock-layout.py
      - name: Build and verify dylib
        run: |
          set -eu
          LCOrbit/Build/build.sh dist/LCFloatingMenu.dylib
          LCOrbit/Tests/verify.sh dist/LCFloatingMenu.dylib
      - name: Compile UIKit regression fixture
        run: python3 LCOrbit/Tests/run-task-switcher-uikit-tests.py --build-only
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: LCFloatingMenu-active-preview-test
          path: dist/LCFloatingMenu.dylib
          retention-days: 14
          if-no-files-found: error
