name: Validate iOS 27 adaptive Dock (temporary)
on:
  push:
    branches:
      - fix/ios27-adaptive-dock-perf-20261120
    paths:
      - LCOrbit/Core/LCOrbitTaskSwitcher.m
      - LCOrbit/Tests/check-adaptive-dock-layout.py
      - .github/workflows/ios27-adaptive-dock-verify.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check adaptive Dock regression
        run: python3 LCOrbit/Tests/check-adaptive-dock-layout.py
      - name: Build and verify dylib
        run: |
          set -eu
          LCOrbit/Build/build.sh dist/LCFloatingMenu.dylib
          LCOrbit/Tests/verify.sh dist/LCFloatingMenu.dylib
      - name: Upload development build
        uses: actions/upload-artifact@v4
        with:
          name: LCFloatingMenu-ios27-test
          path: dist/LCFloatingMenu.dylib
          if-no-files-found: error
          retention-days: 14
