name: LC-SS Export IPA

on:
  workflow_dispatch:
  push:
    branches:
      - feat/export-widget-data
    paths:
      - 'AltStore/**'
      - 'SideStore/**'
      - 'AltWidget/**'
      - 'Shared/**'
      - 'Dependencies/**'
      - 'Makefile'
      - 'Build.xcconfig'
      - 'AltStore.xcodeproj/**'
      - 'scripts/**'
      - '.github/workflows/lcss-ipa.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build tools
        run: brew install ldid xcbeautify
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: '26.2'
      - name: Build unsigned SideStore IPA
        run: python3 scripts/ci/workflow.py build
      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LC-SS-widget-export-IPA
          path: SideStore.ipa
          if-no-files-found: warn
          retention-days: 30
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LC-SS-build-logs
          path: build/logs/
          if-no-files-found: ignore
