name: One-time remove LCFloatingMenu 1.0.29 release and tag
on:
  push:
    branches: [lcss-original]
    paths:
      - '.github/workflows/retire-1.0.29-20261104.yml'
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify identities then delete previous 1.0.29
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ID="$(gh api "repos/$GH_REPO/releases/tags/1.0.29" --jq '.id')"
          TAG_SHA="$(gh api "repos/$GH_REPO/git/ref/tags/1.0.29" --jq '.object.sha')"
          [[ "$ID" == '433702248' && "$TAG_SHA" == '187e3723004320b59f9714a4e987338d3ea2b8a2' ]] || {
            echo '::error::Release or tag changed; refusing to delete a replacement.'
            exit 1
          }
          gh release delete 1.0.29 --yes --cleanup-tag --repo "$GH_REPO"
          ! gh release view 1.0.29 --repo "$GH_REPO" >/dev/null 2>&1
          ! gh api "repos/$GH_REPO/git/ref/tags/1.0.29" >/dev/null 2>&1
          echo 'Removed exact old 1.0.29 Release and Tag.'
