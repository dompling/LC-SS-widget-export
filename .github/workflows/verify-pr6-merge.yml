name: Validate PR6 resolved merge plugin
on:
  push:
    branches: [merge/pr-6-orientation-settings-verified]
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Full plugin regression and iOS arm64 build
        shell: bash
        run: |
          set -euo pipefail
          sh LCOrbit/Build/build.sh dist/LCFloatingMenu.dylib
          sh LCOrbit/Tests/verify.sh dist/LCFloatingMenu.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: LCFloatingMenu-PR6-merge-test
          path: dist/LCFloatingMenu.dylib
          if-no-files-found: error
          retention-days: 7
