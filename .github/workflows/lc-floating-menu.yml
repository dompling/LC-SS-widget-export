name: Build LCFloatingMenu dylib

on:
  workflow_dispatch:
  push:
    branches: [lcss-original, lcfloatingmenu-ci-fix]
    paths:
      - 'LCFloatingMenu/**'
      - 'LCOrbit/**'
      - '.github/workflows/lc-floating-menu.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile iOS arm64 dylib
        # UIGlassEffect is discovered at runtime; the source targets iOS 16 SDK symbols only.
        shell: bash
        run: |
          set -euo pipefail
          LCOrbit/Build/build.sh dist/LCFloatingMenu.dylib
          LCOrbit/Tests/verify.sh dist/LCFloatingMenu.dylib
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: LCFloatingMenu-dylib
          path: dist/LCFloatingMenu.dylib
          if-no-files-found: error
