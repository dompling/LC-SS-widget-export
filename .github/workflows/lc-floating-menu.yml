name: Build LCFloatingMenu dylib
run-name: FloatingMenu ${{ github.ref_type == 'tag' && 'release' || 'build' }} - ${{ github.ref_name }}

# Branch updates create a downloadable Actions artifact, never a Release.
# A semantic-version tag is pushed only when a formal release is requested.
on:
  push:
    branches: [lcss-original]
    tags:
      - '*.*.*'
    paths:
      - 'LCFloatingMenu/**'
      - 'LCOrbit/**'
      - '.github/workflows/lc-floating-menu.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: floating-menu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate version tag matches source
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$GITHUB_REF_NAME"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Use a tag such as 1.0.1 (no v prefix or build suffix)."
            exit 1
          }
          SOURCE_VERSION="$(sed -n 's/^#define FM_MENU_VERSION @"\([^"]*\)".*$/\1/p' LCFloatingMenu/LCFloatingMenu.m | head -n 1)"
          [[ "$VERSION" == "$SOURCE_VERSION" ]] || {
            echo "::error::Tag $VERSION does not match FM_MENU_VERSION $SOURCE_VERSION"
            exit 1
          }
      - name: Compile and verify iOS arm64 dylib
        shell: bash
        run: |
          set -euo pipefail
          LCOrbit/Build/build.sh dist/LCFloatingMenu.dylib
          LCOrbit/Tests/verify.sh dist/LCFloatingMenu.dylib
      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: LCFloatingMenu-dylib
          path: dist/LCFloatingMenu.dylib
          if-no-files-found: error
          retention-days: 14
  publish:
    # IMPORTANT: ordinary branch builds MUST NOT touch GitHub Releases.
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download verified build
        uses: actions/download-artifact@v4
        with:
          name: LCFloatingMenu-dylib
          path: dist
      - name: Publish version and refresh separate FloatingMenu latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$GITHUB_REF_NAME"
          TAG="$VERSION"
          LATEST_TAG="fm-latest"
          BINARY="dist/LCFloatingMenu.dylib"
          test -s "$BINARY"
          sha256sum "$BINARY" || shasum -a 256 "$BINARY"

          # Keep the actual .dylib name unchanged in BOTH releases.
          # Release notes from this tag are published with the binary.
          NOTES="LCFloatingMenu/RELEASE_NOTES_${VERSION}.md"
          if [[ ! -s "$NOTES" ]]; then
            NOTES="dist/release-notes.txt"
            printf 'Verified iOS arm64 dylib from tag %s (commit %s). Import and re-sign in LiveContainer.\n' "$TAG" "$GITHUB_SHA" > "$NOTES"
          fi
          # A version tag is immutable; re-running updates its asset only.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$BINARY" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$NOTES"
          else
            gh release create "$TAG" "$BINARY" \
              --repo "$GITHUB_REPOSITORY" --verify-tag --target "$GITHUB_SHA" \
              --title "LCFloatingMenu $VERSION" \
              --notes-file "$NOTES" \
              --latest
          fi

          cat > dist/latest-info.txt <<EOF
          FM_VERSION=$VERSION
          FM_COMMIT=$GITHUB_SHA
          FM_TAG=$TAG
          EOF

          # Never overwrite a newer latest asset when rebuilding an old tag.
          latest_body="$(gh release view "$LATEST_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' 2>/dev/null || true)"
          latest_version="$(printf '%s\n' "$latest_body" | sed -n 's/^FM_VERSION=//p' | head -n 1)"
          if [[ "$latest_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IFS=. read -r a b c <<< "$latest_version"
            IFS=. read -r x y z <<< "$VERSION"
            if (( 10#$a > 10#$x ||
                  (10#$a == 10#$x && 10#$b > 10#$y) ||
                  (10#$a == 10#$x && 10#$b == 10#$y && 10#$c > 10#$z) )); then
              echo "The current FloatingMenu latest ($latest_version) is newer than $VERSION; keeping it."
              exit 0
            fi
          fi

          if gh release view "$LATEST_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$LATEST_TAG" "$BINARY" dist/latest-info.txt \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$LATEST_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "LCFloatingMenu latest ($VERSION)" \
              --notes-file dist/latest-info.txt --prerelease --latest=false
          else
            gh release create "$LATEST_TAG" "$BINARY" dist/latest-info.txt \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "LCFloatingMenu latest ($VERSION)" \
              --notes-file dist/latest-info.txt --prerelease --latest=false
          fi
          echo "Versioned: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/LCFloatingMenu.dylib"
          echo "Latest: https://github.com/$GITHUB_REPOSITORY/releases/download/$LATEST_TAG/LCFloatingMenu.dylib"
