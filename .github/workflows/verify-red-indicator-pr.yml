name: Verify LCFloatingMenu 1.0.6 integration
on:
  push:
    branches:
      - feat/red-breathing-update-indicator
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify version, build and regression suite
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '#define FM_MENU_VERSION @"1.0.6"' LCFloatingMenu/LCFloatingMenu.m
          grep -Fq 'fm.update.red-breath' LCFloatingMenu/LCFloatingMenu.m
          LCOrbit/Build/build.sh /tmp/LCFloatingMenu-1.0.6-verify.dylib
          LCOrbit/Tests/verify.sh /tmp/LCFloatingMenu-1.0.6-verify.dylib
