name: Verify guest fullscreen support in multitask mode
on:
  push:
    branches:
      - fix/guest-fullscreen-20261029
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Regression tests and verified iOS arm64 build
        shell: bash
        run: |
          set -euo pipefail
          LCOrbit/Build/build.sh /tmp/LCFloatingMenu-guest-fullscreen-test.dylib
          LCOrbit/Tests/verify.sh /tmp/LCFloatingMenu-guest-fullscreen-test.dylib
