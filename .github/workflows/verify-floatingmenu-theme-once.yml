name: Verify FloatingMenu Theme Regression (one-shot)
on:
  push:
    branches: [lcss-original]
    paths:
      - '.github/workflows/verify-floatingmenu-theme-once.yml'
permissions:
  contents: read
jobs:
  uikit-theme:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run real UIKit drawer and appearance regression
        run: |
          python3 LCOrbit/Tests/run-drawer-uikit-tests.py --output-dir "$RUNNER_TEMP/floatingmenu-theme-evidence"
      - name: Keep UIKit result and snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floatingmenu-theme-uikit
          path: ${{ runner.temp }}/floatingmenu-theme-evidence
          if-no-files-found: warn
          retention-days: 5
