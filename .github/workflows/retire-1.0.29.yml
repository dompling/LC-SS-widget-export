name: Retire LCFloatingMenu 1.0.29 (one-time)
on:
  push:
    branches: [lcss-original]
    paths:
      - '.github/workflows/retire-1.0.29.yml'
permissions:
  contents: write
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete exact release and tag after identity checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/$GH_REPO/releases/tags/1.0.29" --jq '.id')"
          tag_object="$(gh api "repos/$GH_REPO/git/ref/tags/1.0.29" --jq '.object.sha')"
          if [[ "$release_id" != "433683570" || "$tag_object" != "28b7feda08292f29ba0aa8ee765380dea6d0282d" ]]; then
            echo '::error::Release or tag has changed. Refusing to delete a replacement.'
            exit 1
          fi
          gh release delete 1.0.29 --yes --cleanup-tag --repo "$GH_REPO"
          if gh release view 1.0.29 --repo "$GH_REPO" >/dev/null 2>&1; then
            echo '::error::Release still exists after deletion.'
            exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/1.0.29" >/dev/null 2>&1; then
            echo '::error::Tag still exists after deletion.'
            exit 1
          fi
          echo 'Release and tag 1.0.29 are deleted.'
