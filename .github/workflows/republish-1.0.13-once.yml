name: Reissue LCFloatingMenu 1.0.13 (one-shot)
run-name: Rebuild and replace version 1.0.13 - ${{ github.sha }}
on:
  push:
    branches: [lcss-original]
    paths:
      - '.github/workflows/republish-1.0.13-once.yml'
permissions:
  contents: write
concurrency:
  group: lcfm-version-publisher
  cancel-in-progress: false
jobs:
  reissue:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build and verify new binary before changing published version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=1.0.13
          SOURCE_VERSION="$(sed -n 's/^#define FM_MENU_VERSION @"\([^"]*\)".*$/\1/p' LCFloatingMenu/LCFloatingMenu.m | head -n 1)"
          test "$VERSION" = "$SOURCE_VERSION"
          test -s "LCFloatingMenu/RELEASE_NOTES_${VERSION}.md"
          LCOrbit/Build/build.sh dist/LCFloatingMenu.dylib
          LCOrbit/Tests/verify.sh dist/LCFloatingMenu.dylib
          test -s dist/LCFloatingMenu.dylib
          shasum -a 256 dist/LCFloatingMenu.dylib
      - name: Replace verified Tag and Release, then refresh fm-latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=1.0.13
          OLD_TAG_SHA=307ee6991594b0774a2e9f75a1d7503369707f36
          CURRENT_TAG_SHA="$(git ls-remote --tags origin "refs/tags/$VERSION" | awk '{print $1}')"
          if [[ "$CURRENT_TAG_SHA" != "$OLD_TAG_SHA" ]]; then
            echo "::error::Published tag changed since preflight, refusing to delete"
            exit 1
          fi
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null
          test -s dist/LCFloatingMenu.dylib
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # This is the only destructive window. The replacement binary is
          # already fully compiled and verified before any removal.
          gh release delete "$VERSION" --repo "$GITHUB_REPOSITORY" --yes
          git push origin ":refs/tags/$VERSION"
          git tag -d "$VERSION" >/dev/null 2>&1 || true
          git tag -a "$VERSION" -m "LCFloatingMenu $VERSION (verified republish)"
          git push origin "refs/tags/$VERSION"
          gh release create "$VERSION" dist/LCFloatingMenu.dylib \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "LCFloatingMenu $VERSION" \
            --notes-file "LCFloatingMenu/RELEASE_NOTES_$VERSION.md" --latest
          printf 'FM_VERSION=%s\nFM_COMMIT=%s\nFM_TAG=%s\n' "$VERSION" "$GITHUB_SHA" "$VERSION" > dist/latest-info.txt
          gh release upload fm-latest dist/LCFloatingMenu.dylib dist/latest-info.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit fm-latest --repo "$GITHUB_REPOSITORY" \
            --title "LCFloatingMenu latest ($VERSION)" \
            --notes-file dist/latest-info.txt --prerelease --latest=false
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json tagName,assets
          gh release view fm-latest --repo "$GITHUB_REPOSITORY" --json body,assets
