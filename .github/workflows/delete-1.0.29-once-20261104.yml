name: Delete superseded LCFloatingMenu 1.0.29 exactly once
on:
  push:
    branches: [lcss-original]
    paths:
      - '.github/workflows/delete-1.0.29-once-20261104.yml'
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete exact Release and Tag only if unchanged
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          expected_release='433729352'
          expected_tag_sha='b19ae576c78fe681a2ba2239293f2951c718d9b5'
          release_id="$(gh api "repos/$GH_REPO/releases/tags/1.0.29" --jq .id)"
          tag_sha="$(gh api "repos/$GH_REPO/git/ref/tags/1.0.29" --jq .object.sha)"
          if [[ "$release_id" != "$expected_release" || "$tag_sha" != "$expected_tag_sha" ]]; then
            echo '::error::1.0.29 has changed; refusing to delete a newer release.'
            exit 1
          fi
          gh release delete 1.0.29 --yes --cleanup-tag --repo "$GH_REPO"
          if gh release view 1.0.29 --repo "$GH_REPO" >/dev/null 2>&1 || gh api "repos/$GH_REPO/git/ref/tags/1.0.29" >/dev/null 2>&1; then
            echo '::error::Release or tag still exists.'
            exit 1
          fi
          echo 'The prior 1.0.29 Release and Tag have been deleted.'
